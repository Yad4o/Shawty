[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omclaw"
version = "0.1.0"
description = "Local-first autonomous AI coding agent powered by Ollama"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Om Yadao", email = "om@example.com" }]
requires-python = ">=3.12"

dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "websockets>=14.0",

  # LLM
  "ollama>=0.4.0",
  "httpx>=0.27.0",

  # Database
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",

  # Docker sandbox
  "docker>=7.1.0",

  # Git
  "gitpython>=3.1.44",

  # GitHub
  "PyGithub>=2.5.0",

  # Browser automation
  "playwright>=1.49.0",

  # Vector store / retrieval
  "faiss-cpu>=1.9.0",
  "chromadb>=0.5.0",

  # Utilities
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "typer>=0.13.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
]

[project.scripts]
omclaw = "omclaw.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
